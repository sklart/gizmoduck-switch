name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile helper scripts
        run: python -m py_compile scripts/*.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
